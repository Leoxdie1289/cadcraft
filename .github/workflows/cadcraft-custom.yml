name: CADCraft - Cruz infinita

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compilar:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Modificar cursor
        shell: pwsh
        run: |
          $path = "crates/ui-egui/src/canvas/cursor.rs"
          $old = '    let len = (rect.height() * app.session.settings.cursorsize as f32 / 100.0).max(12.0);'

          $new = @(
            '    let len = if app.session.settings.cursorsize >= 100.0 {',
            '        rect.width().hypot(rect.height())',
            '    } else {',
            '        (rect.height() * app.session.settings.cursorsize as f32 / 100.0).max(12.0)',
            '    };'
          ) -join "`n"

          $source = [System.IO.File]::ReadAllText($path)

          if (-not $source.Contains($old)) {
            throw "Trecho original nao encontrado."
          }

          [System.IO.File]::WriteAllText(
            $path, $source.Replace($old, $new)
          )

      - name: Compilar CADCraft
        run: cargo build --release --locked -p cadcraft

      - name: Disponibilizar executavel
        uses: actions/upload-artifact@v4
        with:
          name: CADCraft-Cruz-Infinita-Windows-x64
          path: target/release/cadcraft.exe
          if-no-files-found: error
