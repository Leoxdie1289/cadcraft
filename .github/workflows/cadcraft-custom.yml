
name: CADCraft - Cruz infinita

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Verifica atualizacoes a cada 6 horas (UTC)
    - cron: "23 */6 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: cadcraft-atualizacao
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Baixar meu Fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sincronizar com CADCraft original
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/storytold/cadcraft.git
          git fetch upstream main --no-tags

          git merge-base --is-ancestor upstream/main HEAD
          $status = $LASTEXITCODE

          if ($status -eq 0) {
            Write-Host "Fork ja esta atualizado."
          }
          elseif ($status -eq 1) {
            Write-Host "Atualizacao encontrada. Sincronizando..."

            git merge --no-edit upstream/main
            if ($LASTEXITCODE -ne 0) {
              throw "Conflito ao sincronizar o Fork."
            }

            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao enviar atualizacao ao Fork."
            }

            Write-Host "Fork atualizado com sucesso."
          }
          else {
            throw "Erro ao comparar repositorios."
          }

      - name: Verificar ultima versao oficial
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh api repos/storytold/cadcraft/releases/latest --jq .tag_name

          if ($LASTEXITCODE -ne 0 -or -not $tag) {
            throw "Falha ao consultar ultima release."
          }

          $tag = $tag.Trim()
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Ultima versao oficial: $tag"

          $build = $true

          if ($env:GITHUB_EVENT_NAME -eq "schedule") {
            $names = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')

            if ($LASTEXITCODE -ne 0) {
              throw "Erro ao consultar Artifacts."
            }

            $prefix = "CADCraft-Cruz-Infinita-$tag-run"

            if (@($names | Where-Object { $_.StartsWith($prefix) }).Count -gt 0) {
              Write-Host "Esta versao ja foi compilada."
              $build = $false
            }
          }

          "build=$($build.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Baixar versao oficial mais recente
        if: steps.release.outputs.build == 'true'
        uses: actions/checkout@v6
        with:
          repository: storytold/cadcraft
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Preparar Rust
        if: steps.release.outputs.build == 'true'
        run: |
          rustup update stable
          rustup default stable

      - name: Aplicar cruz infinita
        if: steps.release.outputs.build == 'true'
        shell: pwsh
        run: |
          $path = "crates/ui-egui/src/canvas/cursor.rs"

          $old = '    let len = (rect.height() * app.session.settings.cursorsize as f32 / 100.0).max(12.0);'

          $new = @(
            '    let len = if app.session.settings.cursorsize >= 100.0 {',
            '        rect.width().hypot(rect.height())',
            '    } else {',
            '        (rect.height() * app.session.settings.cursorsize as f32 / 100.0).max(12.0)',
            '    };'
          ) -join "`n"

          $source = [System.IO.File]::ReadAllText($path)

          if (-not $source.Contains($old)) {
            throw "Codigo do cursor mudou. Revisao necessaria."
          }

          [System.IO.File]::WriteAllText(
            $path, $source.Replace($old, $new)
          )

          Write-Host "Cruz infinita aplicada."

      - name: Compilar CADCraft
        if: steps.release.outputs.build == 'true'
        run: cargo build --release --locked -p cadcraft

      - name: Disponibilizar executavel
        if: steps.release.outputs.build == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: CADCraft-Cruz-Infinita-${{ steps.release.outputs.tag }}-run${{ github.run_number }}
          path: target/release/cadcraft.exe
          if-no-files-found: error
          retention-days: 90
