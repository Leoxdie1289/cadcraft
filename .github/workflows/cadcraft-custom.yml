
name: CADCraft - Cruz infinita

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * *"

permissions:
  contents: read
  actions: read

jobs:
  compilar:
    runs-on: windows-latest

    steps:
      - name: Verificar ultima versao oficial
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh api repos/storytold/cadcraft/releases/latest --jq .tag_name

          if ($LASTEXITCODE -ne 0 -or -not $tag) {
            throw "Nao foi possivel consultar a ultima versao."
          }

          $tag = $tag.Trim()
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Versao oficial encontrada: $tag"

          $build = $true

          if ($env:GITHUB_EVENT_NAME -eq "schedule") {
            $names = @(gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')

            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao consultar os Artifacts."
            }

            $prefix = "CADCraft-Cruz-Infinita-$tag-run"

            if (@($names | Where-Object { $_.StartsWith($prefix) }).Count -gt 0) {
              Write-Host "Esta versao ja foi compilada."
              $build = $false
            }
          }

          "build=$($build.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Baixar ultima versao oficial
        if: steps.release.outputs.build == 'true'
        uses: actions/checkout@v6
        with:
          repository: storytold/cadcraft
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Preparar Rust
        if: steps.release.outputs.build == 'true'
        run: |
          rustup update stable
          rustup default stable

      - name: Aplicar cruz infinita
        if: steps.release.outputs.build == 'true'
        shell: pwsh
        run: |
          $path = "crates/ui-egui/src/canvas/cursor.rs"

          $old = '    let len = (rect.height() * app.session.settings.cursorsize as f32 / 100.0).max(12.0);'

          $new = @(
            '    let len = if app.session.settings.cursorsize >= 100.0 {',
            '        rect.width().hypot(rect.height())',
            '    } else {',
            '        (rect.height() * app.session.settings.cursorsize as f32 / 100.0).max(12.0)',
            '    };'
          ) -join "`n"

          $source = [System.IO.File]::ReadAllText($path)

          if (-not $source.Contains($old)) {
            throw "Codigo do cursor mudou. Revisao necessaria."
          }

          [System.IO.File]::WriteAllText(
            $path, $source.Replace($old, $new)
          )

          Write-Host "Modificacao aplicada com sucesso."

      - name: Compilar CADCraft
        if: steps.release.outputs.build == 'true'
        run: cargo build --release --locked -p cadcraft

      - name: Disponibilizar executavel
        if: steps.release.outputs.build == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: CADCraft-Cruz-Infinita-${{ steps.release.outputs.tag }}-run${{ github.run_number }}
          path: target/release/cadcraft.exe
          if-no-files-found: error
          retention-days: 90
